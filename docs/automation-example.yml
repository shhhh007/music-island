name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Build and verify release payload
        shell: powershell
        run: .\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: music-island-windows
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: music-island-windows
          path: dist
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "Music Island $env:GITHUB_REF_NAME" --notes-file docs/release-notes.md
